name: CI

# Run for pull requests and by hand (Actions > CI > Run workflow), not on every push to main. A
# private copy pays for each minute, so there even a pull request's run skips every job.
# contributors' pull requests, and by hand (Actions > CI > Run workflow); not every push to main
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  rust:
    name: Rust (format, clippy, tests)
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin, aarch64-apple-ios
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Clippy with diagnostics
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -aE 'error' /tmp/clippy.log | head -80 | while IFS= read -r line; do
              printf '::error title=clippy::%s\n' "$line"
            done
            exit $code
          fi
      # the code only Apple's systems build (the Mac's pen, Finder, video, PDF and fonts; the iPad
      # app's layer and render thread), checked without linking: no Mac needed
      - name: Clippy for macOS and iPadOS
        run: |
          cargo clippy --target aarch64-apple-darwin -p prostudio-desktop -- -D warnings
          cargo clippy --target aarch64-apple-ios -p prostudio-core --lib -- -D warnings
      # the GPU tests skip themselves: the runner has no GPU
      - run: cargo test --workspace

  android:
    name: Android (clippy, lint, unit tests, release APK)
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --version "^4" --locked
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # the code only Android builds (the surface and the render thread)
      - name: Clippy for Android
        run: |
          set +e
          cargo ndk -t arm64-v8a --platform 29 clippy -p prostudio-core --lib -- -D warnings > /tmp/clippy-android.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -aE 'error' /tmp/clippy-android.log | head -80 | while IFS= read -r line; do
              printf '::error title=android-clippy::%s\n' "$line"
            done
            exit $code
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Release APK and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Pprostudio.abis=x86_64
      - name: 16 KB pages
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          dir=$(mktemp -d)
          unzip -q "$apk" 'lib/*' -d "$dir"
          for so in "$dir"/lib/*/*.so; do
            for align in $("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((align)) -lt 16384 ]; then
                echo "$so: a segment aligned to $align"
                exit 1
              fi
            done
          done
          echo "every library's segments are aligned to 16 KB"
