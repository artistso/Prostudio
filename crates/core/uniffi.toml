# UniFFI bindings of the `prostudio_core` library: Kotlin for the Android app, Swift for the iPad app.

[bindings.kotlin]
package_name = "io.github.artistso.prostudio.core"
cdylib_name = "prostudio_core"

# The Swift file is compiled into the iPad app; its C half (ProStudioCoreFFI, a header and a module
# map) is found on the import path ios/build-rust.sh writes.
[bindings.swift]
module_name = "ProStudioCore"
ffi_module_name = "ProStudioCoreFFI"
